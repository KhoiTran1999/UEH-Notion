name: Telegram On-Demand Trigger

on:
  repository_dispatch:
    types: [telegram_command]

jobs:
  run-bot-command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot Command
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_TASK: ${{ secrets.NOTION_DB_TASK }}
          NOTION_DB_GHI_CHEP_ID: ${{ secrets.NOTION_DB_GHI_CHEP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          NOTION_PROMPT_DATABASE_ID: ${{ secrets.NOTION_PROMPT_DATABASE_ID }}
          NOTION_PROMPT_TOKEN: ${{ secrets.NOTION_PROMPT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          USE_CUSTOM_AI: 'true'
          CUSTOM_AI_BASE_URL: ${{ secrets.CUSTOM_AI_BASE_URL }}
          CUSTOM_AI_API_KEY: ${{ secrets.CUSTOM_AI_API_KEY }}
          CUSTOM_AI_MODEL: ${{ secrets.CUSTOM_AI_MODEL }}
          MODEL_BRAIN: ${{ secrets.MODEL_BRAIN }}
          MODEL_WORKER: ${{ secrets.MODEL_WORKER }}
          REASONING_EFFORT: ${{ secrets.REASONING_EFFORT }}
          CUSTOM_AI_VOICE_MODEL: ${{ secrets.CUSTOM_AI_VOICE_MODEL }}
          WORKFLOW_MODE: ${{ github.event.client_payload.mode }}
          WORKFLOW_USER_ID: ${{ github.event.client_payload.user_id }}
          WORKFLOW_TOPIC_ID: ${{ github.event.client_payload.topic_id }}
        run: |
          set -euo pipefail

          case "$WORKFLOW_MODE" in
            daily-report|study-assistant|mark-mastered|mark-review)
              ;;
            *)
              echo "::error::Unsupported workflow mode: $WORKFLOW_MODE"
              exit 1
              ;;
          esac

          args=(src/main.py run "$WORKFLOW_MODE" --chat_id "$WORKFLOW_USER_ID")
          if [[ -n "${WORKFLOW_TOPIC_ID:-}" ]]; then
            args+=(--topic_id "$WORKFLOW_TOPIC_ID")
          fi

          echo "Running supported bot command: $WORKFLOW_MODE"
          python "${args[@]}"
