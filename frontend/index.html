<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- KaTeX for LaTeX Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 min-h-screen text-gray-800 dark:text-gray-200 font-sans">
    <div id="app" class="max-w-md mx-auto p-4 flex flex-col h-screen">

        <!-- Loading State -->
        <div id="loading-view" class="hidden flex-1 flex flex-col items-center justify-center p-6">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
            <p id="loading-text" class="text-gray-600 dark:text-gray-400 text-center mb-4 font-medium">Đang tải...</p>
            <div class="w-full bg-gray-200 dark:bg-gray-800 h-2 rounded-full overflow-hidden max-w-xs shadow-inner">
                <div id="loading-progress-bar" class="bg-blue-500 h-2 rounded-full w-0 transition-all duration-300 ease-out"></div>
            </div>
            <span id="loading-percentage" class="text-xs text-blue-500 font-bold mt-2">0%</span>
        </div>

        <!-- Topics View -->
        <div id="topics-view" class="flex-1 flex flex-col">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Chọn chủ đề ôn tập</h1>
                <button id="refresh-candidates-btn" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800 transition text-gray-500 dark:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-xl font-bold" title="Tải lại từ Notion" aria-label="Tải lại danh sách chủ đề từ Notion">
                    ⟳
                </button>
            </div>

            <!-- Filters & Search -->
            <div id="filters-container" class="mb-4 space-y-2">
                <input type="text" id="search-input" placeholder="🔍 Tìm kiếm chủ đề..." class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150">
                <div class="flex gap-2">
                    <select id="course-filter" class="flex-1 px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150">
                        <option value="">Tất cả môn học</option>
                    </select>
                    <button id="quick-review-btn" class="bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-sm transition duration-150 flex items-center gap-1.5 shrink-0">
                        ⚡ Ôn tập nhanh
                    </button>
                </div>
                <div class="flex gap-2">
                    <button id="toggle-timeline-btn" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white text-xs font-bold py-2.5 rounded-xl shadow-sm transition duration-150 flex items-center justify-center gap-1.5">
                        📅 Xem Deadline trên Web
                    </button>
                </div>
            </div>

            <!-- Resume Quiz Banner -->
            <div id="resume-quiz-banner" class="hidden mb-4 p-3.5 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-xl shadow-md flex items-center justify-between gap-3 fade-in cursor-pointer hover:shadow-lg transition">
                <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-1.5 text-xs font-semibold opacity-90">
                        <span>⏱️</span>
                        <span>Đang làm dở</span>
                        <span id="resume-quiz-badge" class="bg-white/20 text-[10px] px-1.5 py-0.5 rounded-full font-bold">Câu 1/5</span>
                    </div>
                    <p id="resume-quiz-title" class="font-bold text-sm truncate mt-0.5">Tên chủ đề</p>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                    <button id="resume-quiz-btn" class="bg-white text-blue-600 hover:bg-blue-50 text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition active:scale-95">
                        Làm tiếp
                    </button>
                    <button id="discard-resume-btn" class="text-white/70 hover:text-white text-lg p-1 transition" title="Bỏ qua" aria-label="Bỏ qua bài làm dở">
                        ✕
                    </button>
                </div>
            </div>


            <div id="topics-list" class="space-y-3 overflow-y-auto pb-4">
                <!-- Topics injected here -->
            </div>
            <div id="no-topics" class="hidden text-center text-gray-500 dark:text-gray-400 mt-10">
                Không có chủ đề nào cần ôn tập.
            </div>
        </div>

        <!-- Quiz View -->
        <div id="quiz-view" class="hidden flex-1 flex flex-col overflow-y-auto bg-white dark:bg-gray-900 p-4 rounded-xl shadow dark:shadow-none dark:border dark:border-gray-800">
            <div class="flex items-center justify-between mb-3 border-b dark:border-gray-800 pb-2">
                <div class="flex items-center space-x-2 min-w-0">
                    <button id="close-quiz-btn" class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 flex items-center justify-center p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition mr-1" title="Quay lại" aria-label="Quay lại danh sách chủ đề">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                    </button>
                    <div class="min-w-0">
                        <h2 id="quiz-topic-title" class="text-base md:text-lg font-bold truncate text-gray-800 dark:text-gray-100">Topic</h2>
                        <div id="quiz-timer" class="text-[11px] text-gray-500 dark:text-gray-400 font-medium flex items-center gap-1">
                            <span>⏱️</span> <span id="quiz-timer-text">00:00</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center space-x-1.5 shrink-0">
                    <button id="flag-question-btn" class="w-8 h-8 flex items-center justify-center rounded-xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 hover:bg-amber-50 dark:hover:bg-gray-800 transition text-gray-400 focus:outline-none shadow-sm text-sm" title="Đánh dấu câu hỏi này" aria-label="Đánh dấu câu hỏi">
                        🚩
                    </button>
                    <button id="copy-question-btn" class="w-8 h-8 flex items-center justify-center rounded-xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800 transition text-gray-500 dark:text-gray-400 focus:outline-none shadow-sm text-sm font-bold" title="Copy câu hỏi" aria-label="Sao chép câu hỏi">📋</button>
                    <button id="force-refresh-btn" class="w-8 h-8 flex items-center justify-center rounded-xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800 transition text-gray-500 dark:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-base font-bold" title="Đổi câu hỏi mới" aria-label="Tạo bộ câu hỏi mới">
                        ⟳
                    </button>
                    <span id="quiz-progress" class="text-xs font-bold text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded-full">1/5</span>
                </div>
            </div>

            <!-- Quiz Progress Bar -->
            <div id="quiz-progress-container" class="w-full bg-gray-200 dark:bg-gray-800 h-1.5 rounded-full mb-2 overflow-hidden">
                <div id="quiz-progress-bar" class="bg-blue-500 h-1.5 rounded-full w-0 transition-all duration-300 ease-out"></div>
            </div>

            <!-- Interactive Dot Progress Indicator -->
            <div id="quiz-dot-container" class="flex flex-wrap justify-center items-center gap-1.5 mb-4 py-1 px-2 bg-gray-50 dark:bg-gray-800/40 rounded-xl border border-gray-100 dark:border-gray-800"></div>

            <div id="quiz-content" class="fade-in flex-1 flex flex-col">
                <div id="question-text" class="text-base md:text-lg font-bold text-gray-800 dark:text-gray-100 mb-4 bg-white dark:bg-gray-900 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">What is the question?</div>
                <div id="options-container" class="space-y-3 mt-1 flex flex-col"></div>
                <div id="explanation-box" class="hidden mt-4 p-4 rounded-xl bg-gradient-to-r from-blue-50 to-indigo-50 dark:from-gray-800 dark:to-gray-800/80 border border-blue-100 dark:border-gray-700 shadow-inner text-sm md:text-base leading-relaxed text-gray-700 dark:text-gray-300"></div>
            </div>

            <!-- Quiz Results -->
            <div id="quiz-results" class="hidden fade-in flex-1 flex flex-col space-y-4 py-2">
                <div class="bg-blue-50 dark:bg-gray-800/50 border border-blue-100 dark:border-gray-800 rounded-2xl p-5 w-full shadow-sm text-center space-y-3">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 text-3xl">
                        🏆
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 dark:text-gray-100">Kết quả ôn tập</h3>

                    <div class="grid grid-cols-3 gap-2 py-2 border-y border-blue-100 dark:border-gray-700/60 my-2">
                        <div class="flex flex-col items-center">
                            <span class="text-[11px] text-gray-500 dark:text-gray-400 font-medium">Điểm số</span>
                            <span class="text-lg font-extrabold text-blue-600 dark:text-blue-400" id="results-score">0 / 0</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[11px] text-gray-500 dark:text-gray-400 font-medium">Tỷ lệ đúng</span>
                            <span class="text-lg font-extrabold text-indigo-600 dark:text-indigo-400" id="results-percentage">0%</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-[11px] text-gray-500 dark:text-gray-400 font-medium">Thời gian</span>
                            <span class="text-lg font-extrabold text-emerald-600 dark:text-emerald-400" id="results-time">00:00</span>
                        </div>
                    </div>

                    <p id="results-feedback" class="text-gray-700 dark:text-gray-300 text-xs md:text-sm leading-relaxed px-2 font-medium">
                        Phản hồi
                    </p>
                </div>

                <!-- Questions Overview Matrix -->
                <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-3.5 space-y-2">
                    <div class="flex items-center justify-between text-xs font-bold text-gray-700 dark:text-gray-300">
                        <span>Chi tiết từng câu</span>
                        <span class="text-[10px] font-normal text-gray-500 dark:text-gray-400">Bấm ô để xem giải thích</span>
                    </div>
                    <div id="results-grid" class="grid grid-cols-5 gap-2 pt-1"></div>
                </div>

                <!-- Review Buttons Group -->
                <div class="space-y-2">
                    <div class="flex gap-2">
                        <button id="review-answers-btn" class="flex-1 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 text-xs font-bold py-2.5 px-3 rounded-xl transition flex items-center justify-center gap-1.5 border border-gray-200 dark:border-gray-700">
                            🔍 Xem tất cả câu hỏi
                        </button>
                        <button id="review-mistakes-btn" class="hidden flex-1 bg-red-50 hover:bg-red-100 dark:bg-red-950/40 dark:hover:bg-red-950/60 text-red-600 dark:text-red-400 text-xs font-bold py-2.5 px-3 rounded-xl transition flex items-center justify-center gap-1.5 border border-red-200 dark:border-red-900/50">
                            🎯 Xem <span id="mistakes-count">0</span> câu sai
                        </button>
                    </div>
                    <div class="flex gap-2">
                        <button id="retake-mistakes-btn" class="hidden flex-1 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-2.5 px-3 rounded-xl transition flex items-center justify-center gap-1.5 shadow-sm">
                            🔄 Làm lại các câu sai
                        </button>
                        <button id="share-results-btn" class="flex-1 bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950/40 dark:hover:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 text-xs font-bold py-2.5 px-3 rounded-xl transition flex items-center justify-center gap-1.5 border border-indigo-200 dark:border-indigo-900/50">
                            📋 Sao chép kết quả
                        </button>
                    </div>
                </div>
            </div>

            <!-- Quiz Controls -->
            <div class="mt-4 space-y-3">
                <div id="nav-btns" class="flex space-x-3">
                    <button id="prev-btn" class="hidden flex-1 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold py-3 px-4 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-200 dark:hover:bg-gray-700 transition text-sm flex items-center justify-center gap-1">
                        ← Câu trước
                    </button>
                    <button id="next-btn" class="hidden flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition text-sm flex items-center justify-center gap-1">
                        Câu tiếp →
                    </button>
                </div>

                <button id="show-results-btn" class="hidden w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition text-sm flex items-center justify-center gap-1">
                    🏁 Xem kết quả
                </button>

                <!-- Final Status Buttons -->
                <div id="status-btns" class="hidden flex space-x-3">
                    <button id="status-chua-btn" class="flex-1 bg-red-100 dark:bg-red-950/40 text-red-700 dark:text-red-400 font-bold py-3 px-2 rounded-xl border border-red-200 dark:border-red-900/50 hover:bg-red-200 dark:hover:bg-red-950/60 transition text-sm">
                        ⚠️ Cần xem lại
                    </button>
                    <button id="status-nam-btn" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-2 rounded-xl shadow-sm transition text-sm">
                        ✅ Nắm vững
                    </button>
                </div>

                <button id="quiz-done-btn" class="hidden w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition text-sm">
                    Hoàn thành
                </button>
            </div>

        </div>

        <!-- Timeline View -->
        <div id="timeline-view" class="hidden flex-1 flex flex-col overflow-y-auto bg-white dark:bg-gray-900 p-4 rounded-xl shadow dark:shadow-none dark:border dark:border-gray-800">
            <div class="flex items-center justify-between mb-4 border-b dark:border-gray-800 pb-2">
                <div class="flex items-center space-x-2 min-w-0">
                    <button id="close-timeline-btn" class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 flex items-center justify-center p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition mr-1" title="Quay lại" aria-label="Quay lại danh sách chủ đề">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                    </button>
                    <h2 class="text-lg font-bold truncate text-gray-800 dark:text-gray-100">📅 Lịch Deadline</h2>
                </div>
                <button id="refresh-timeline-btn" class="w-8 h-8 flex items-center justify-center rounded-xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800 transition text-gray-500 dark:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-base font-bold" title="Tải lại từ Notion" aria-label="Tải lại timeline từ Notion">
                    ⟳
                </button>
            </div>

            <!-- Filter controls -->
            <div class="flex gap-2 mb-4 shrink-0">
                <select id="timeline-course-filter" class="flex-1 px-2 py-2 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 text-[10px] font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition duration-150">
                    <option value="">Tất cả môn</option>
                </select>
                <select id="timeline-month-filter" class="flex-1 px-2 py-2 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 text-[10px] font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition duration-150">
                    <option value="">Tất cả tháng</option>
                </select>
                <select id="timeline-date-filter" class="flex-1 px-2 py-2 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 text-[10px] font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition duration-150">
                    <option value="">Tất cả thời gian</option>
                    <option value="today">Hôm nay</option>
                    <option value="week">Tuần này</option>
                    <option value="month">Tháng này</option>
                </select>
            </div>
            <div id="timeline-container" class="space-y-4 relative before:absolute before:inset-y-0 before:left-[72px] before:w-0.5 before:bg-gray-200 dark:before:bg-gray-800">
                <!-- Timeline items will be injected here -->
            </div>
        </div>


    </div>

    <script src="app.js"></script>
</body>
</html>
